<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Pro - TESTSEITE</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-add { background: #00b300; color: white; }
        .btn-remove { background: #d90000; color: white; }
        .btn-cam-restart { background: #ff9800; color: white; padding: 10px; font-size: 15px; margin-top: 5px; }
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 350px; overflow-y: auto; font-size: 16px; }
        .product-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .product-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-rename { background: #8a2be2; color: white; width: auto; padding: 5px 12px; margin: 0; font-size: 14px; border-radius: 4px; display: inline-block; }
        video { width: 100%; max-width: 400px; border-radius: 12px; background: #000; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="app-screen">
            <h3 id="status-label" style="color: #00b300;">TEST-MODUS | Bereit zum Scannen</h3>
            
            <!-- Der stabile Kamera-Sucher -->
            <video id="webcam" autoplay playsinline></video>
            
            <!-- Der neue Rettungs-Knopf, falls die Kamera blockiert -->
            <button class="btn-cam-restart" onclick="startKamera()">Kamera neu starten 📷</button>
            
            <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
            <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
            
            <h3>Dein Test-Bestand:</h3>
            <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>
        </div>
    </div>

    <script>
        let mode = "add";
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;

        // Lädt den Bestand permanent aus dem Handyspeicher
        let products = JSON.parse(localStorage.getItem('testProducts')) || {};

        window.addEventListener('load', () => {
            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
                startKamera();
            } else {
                alert("Bitte nutze Google Chrome auf Android.");
            }
            updateListDisplay();
        });

        function startKamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    scanSchleife(video);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Kamera-Zugriff blockiert. Tippe auf den orangen Button zum Reparieren.");
            });
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        let code = barcodes[0].rawValue;
                        let now = Date.now();
                        
                        if (code === lastScannedCode && (now - lastScanTime) < 3000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        
                        if (window.navigator.vibrate) window.navigator.vibrate(100);

                        if (mode === "add") {
                            if (!products[code]) {
                                // Speichert Name, Datum und Ort als separate Felder im Speicher ab!
                                products[code] = { 
                                    rawName: "", 
                                    datum: "", 
                                    ort: "",
                                    fullName: "Neu: " + code, 
                                    anzahl: 1 
                                };
                            } else {
                                products[code].anzahl += 1;
                            }
                        } else if (mode === "remove") {
                            if (products[code]) {
                                products[code].anzahl -= 1;
                                if (products[code].anzahl <= 0) delete products[code];
                            }
                        }
                        
                        localStorage.setItem('testProducts', JSON.stringify(products));
                        updateListDisplay();
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 200);
        // 📷 HIER ENDET DER KAMERA-CODE
        // ==========================================


        // ==========================================
        // 📋 AB HIER FOLGT DIE NEUE BESTANDS-LISTE (DEINE UPGRADES!)
        // ==========================================
        
        function renameProduct(code) {
            let item = products[code];

            let nameInput = prompt("1. Name des Produkts eingeben:", item.rawName || "");
            if (nameInput === null) return; 
            
            let datumInput = prompt("2. Ablaufdatum eingeben (oder leer lassen):", item.datum || "");
            if (datumInput === null) return;

            let ortInput = prompt("3. Lagerort eingeben (oder leer lassen):", item.ort || "");
            if (ortInput === null) return;

            item.rawName = nameInput;
            item.datum = datumInput;
            item.ort = ortInput;

            let bereinigterNeuerName = nameInput.trim().toLowerCase();
            let gefundenerCode = Object.keys(products).find(c => 
                c !== code && products[c].rawName.trim().toLowerCase() === bereinigterNeuerName
            );

            if (gefundenerCode && bereinigterNeuerName !== "") {
                products[gefundenerCode].anzahl += item.anzahl;
                products[gefundenerCode].datum = datumInput;
                products[gefundenerCode].ort = ortInput;
                
                let anzeigName = products[gefundenerCode].rawName || "Unbekannt";
                let anzeigDatum = products[gefundenerCode].datum ? " | ⏱️ " + products[gefundenerCode].datum : "";
                let anzeigOrt = products[gefundenerCode].ort ? " | 📍 " + products[gefundenerCode].ort : "";
                products[gefundenerCode].fullName = anzeigName + anzeigDatum + anzeigOrt;

                delete products[code];
            } else {
                let anzeigeName = item.rawName || "Unbekannt";
                let anzeigeDatum = item.datum ? " | ⏱️ " + item.datum : "";
                let anzeigeOrt = item.ort ? " | 📍 " + item.ort : "";
                item.fullName = anzeigeName + anzeigeDatum + anzeigeOrt;
            }
            
            localStorage.setItem('testProducts', JSON.stringify(products));
            updateListDisplay();
        }

        function setMode(newMode) {
            mode = newMode;
            if(newMode === "add") {
                document.getElementById("status-label").innerText = "TEST-MODUS | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#00b300";
            } else {
                document.getElementById("status-label").innerText = "TEST-MODUS | Entfernen (-) | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#d90000";
            }
        }

        function triggerSort(type) {
            sortDirection = sortDirection * -1;
            const nameBtn = document.getElementById('sort-name');
            nameBtn.innerText = sortDirection === 1 ? "A-Z 🔤" : "Z-A 🔤";
            updateListDisplay();
        }

        function exportBestand() {
            if (Object.keys(products).length === 0) {
                alert("Dein Bestand ist leer! Es gibt nichts zu exportieren.");
                return;
            }
            let exportString = btoa(unescape(encodeURIComponent(JSON.stringify(products))));
            navigator.clipboard.writeText(exportString).then(() => {
                alert("📋 Bestand erfolgreich kopiert! Du kannst den Code jetzt per WhatsApp an ein anderes Handy schicken.");
            }).catch(err => {
                alert("Fehler beim Kopieren. Hier ist dein Code:\n\n" + exportString);
            });
        }
