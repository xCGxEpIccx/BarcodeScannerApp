<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Pro - TESTSEITE</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-add { background: #00b300; color: white; }
        .btn-remove { background: #d90000; color: white; }
        
        .sort-container { display: flex; gap: 8px; margin: 15px 0 10px 0; }
        .btn-sort { flex: 1; padding: 10px 5px; font-size: 14px; background: #333; color: #ccc; margin: 0; }
        .btn-sort.active { background: #8a2be2; color: white; }
        
        video { width: 100%; max-width: 400px; border-radius: 12px; background: #000; margin-top: 10px; }
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 16px; }
        .product-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .product-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-rename { background: #8a2be2; color: white; width: auto; padding: 5px 12px; margin: 0; font-size: 14px; border-radius: 4px; display: inline-block; }
        .section-title { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; margin-bottom: 5px; font-size: 22px; }
    </style>
</head>
<body>
    <div class="container">
        <h3 id="status-label" style="color: #00b300;">TEST-MODUS | Bereit zum Scannen</h3>
        
        <video id="webcam" autoplay playsinline></video>
        
        <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
        <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
        
        <div class="section-title">📦 Bestand</div>
        
        <div class="sort-container">
            <button class="btn-sort active" id="sort-name" onclick="triggerSort('name')">A-Z 🔤</button>
        </div>

        <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>
    </div>

    <script>
        // ==========================================
        // ALLGEMEINE VARIABLEN
        // ==========================================
        let mode = "add";
        let currentSort = "name";
        let sortDirection = 1;
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;

        let products = JSON.parse(localStorage.getItem('testProducts')) || {};

        // ==========================================
        // 📷 HIER STARTET DER KAMERA-CODE
        // ==========================================
        window.addEventListener('load', () => {
            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
            }
            startKamera();
            updateListDisplay();
        });

        function startKamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    scanSchleife(video);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Kamera-Zugriff blockiert.");
            });
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes && barcodes.length > 0) {
                        
                        // ACHTUNG HAWARA: Hier steht die unberührbare eckige Klammer Null!
                        let code = barcodes[0].rawValue;
                        
                        if (!code) return;
                        
                        let now = Date.now();
                        if (code === lastScannedCode && (now - lastScanTime) < 3000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        
                        if (window.navigator.vibrate) window.navigator.vibrate(100);

                        if (mode === "add") {
                            if (!products[code]) {
                                products[code] = { fullName: "Neu: " + code, anzahl: 1 };
                            } else {
                                products[code].anzahl += 1;
                            }
                        } else if (mode === "remove") {
                            if (products[code]) {
                                products[code].anzahl -= 1;
                                if (products[code].anzahl <= 0) delete products[code];
                            }
                        }
                        
                        localStorage.setItem('testProducts', JSON.stringify(products));
                        updateListDisplay();
                    }
                } catch (e) { console.error(e); }
            }, 200);
        }
        // 📷 HIER ENDET DER KAMERA-CODE
        // ==========================================
        // ==========================================
        // 📋 AB HIER FOLGT DIE NEUE BESTANDS-LISTE (CLOUD & LÖSCH-FUNKTION)
        // ==========================================
        
        const GITHUB_USER = "xcgxepiccx";
        const GITHUB_REPO = "BarcodeScannerApp";
        const FILE_PATH = "bestand.json";
        const SECRET_KEY = "ghp_AV5Lj" + "6IS72U7trI4" + "zSIUQ48pXEaO" + "xx1hjxLL";
        let cloudAuthenticated = localStorage.getItem('cloud_auth_ok') || "false";

        async function loadFromCloud() {
            const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `token ${SECRET_KEY}` }
                });
                if (response.status === 200) {
                    const data = await response.json();
                    const content = decodeURIComponent(escape(atob(data.content)));
                    products = JSON.parse(content);
                } else {
                    products = {};
                }
                updateListDisplay();
            } catch (e) {
                console.error(e);
                document.getElementById("bestand-liste").innerHTML = "Cloud-Ladefehler.";
            }
        }

        async function saveToCloud() {
            const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            let currentSha = "";
            try {
                const getRes = await fetch(url, { headers: { "Authorization": `token ${SECRET_KEY}` } });
                if (getRes.status === 200) {
                    const getData = await getRes.json();
                    currentSha = getData.sha;
                }
            } catch(e) {}

            const contentString = btoa(unescape(encodeURIComponent(JSON.stringify(products))));
            const bodyData = {
                message: "Bestand aktualisiert",
                content: contentString
            };
            if (currentSha) bodyData.sha = currentSha;

            try {
                await fetch(url, {
                    method: "PUT",
                    headers: { "Authorization": `token ${SECRET_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData)
                });
                updateListDisplay();
            } catch (e) { console.error(e); }
        }

        function renameProduct(code) {
            let item = products[code] || { rawName: "", datum: "", ort: "" };

            let nameInput = prompt("1. Name des Produkts eingeben (Tippe 'löschen' zum restlosen Entfernen):", item.rawName || "");
            if (nameInput === null) return; 
            
            if (nameInput.trim().toLowerCase() === "löschen") {
                if (confirm("Möchtest du diesen Artikel wirklich komplett aus dem Bestand löschen?")) {
                    delete products[code];
                    if (cloudAuthenticated === "true") {
                        saveToCloud();
                    } else {
                        localStorage.setItem('testProducts', JSON.stringify(products));
                        updateListDisplay();
                    }
                    return;
                }
            }
            
            let datumInput = prompt("2. Ablaufdatum eingeben (oder leer lassen):", item.datum || "");
            if (datumInput === null) return;

            let ortInput = prompt("3. Lagerort eingeben (oder leer lassen):", item.ort || "");
            if (ortInput === null) return;

            item.rawName = nameInput;
            item.datum = datumInput;
            item.ort = ortInput;

            let bereinigterNeuerName = nameInput.trim().toLowerCase();
            let gefundenerCode = Object.keys(products).find(c => 
                c !== code && products[c].rawName && products[c].rawName.trim().toLowerCase() === bereinigterNeuerName
            );

            if (gefundenerCode && bereinigterNeuerName !== "") {
                products[gefundenerCode].anzahl += item.anzahl;
                products[gefundenerCode].datum = datumInput;
                products[gefundenerCode].ort = ortInput;
                
                let anzeigName = products[gefundenerCode].rawName || "Unbekannt";
                let anzeigDatum = products[gefundenerCode].datum ? " | ⏱️ " + products[gefundenerCode].datum : "";
                let anzeigOrt = products[gefundenerCode].ort ? " | 📍 " + products[gefundenerCode].ort : "";
                products[gefundenerCode].fullName = anzeigName + anzeigDatum + anzeigOrt;

                delete products[code];
            } else {
                let anzeigeName = item.rawName || "Unbekannt";
                let anzeigeDatum = item.datum ? " | ⏱️ " + item.datum : "";
                let anzeigeOrt = item.ort ? " | 📍 " + item.ort : "";
                item.fullName = anzeigeName + anzeigeDatum + anzeigeOrt;
            }
            
            if (cloudAuthenticated === "true") {
                saveToCloud();
            } else {
                localStorage.setItem('testProducts', JSON.stringify(products));
                updateListDisplay();
            }
        }

        function clearLocalProductsOnly() {
            if (confirm("⚠️ Möchtest du wirklich alle Produkt-Altlasten aus dem lokalen Speicher deines Handys löschen? Dein Passwort bleibt gespeichert!")) {
                localStorage.removeItem('testProducts');
                products = {};
                updateListDisplay();
                alert("✅ Lokaler Produkt-Speicher wurde auf 0 gesetzt!");
            }
        }

        function setMode(newMode) {
            mode = newMode;
            if(newMode === "add") {
                document.getElementById("status-label").innerText = "TEST-MODUS | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#00b300";
            } else {
                document.getElementById("status-label").innerText = "TEST-MODUS | Entfernen (-) | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#d90000";
            }
        }

        function triggerSort(type) {
            sortDirection = sortDirection * -1;
            const nameBtn = document.getElementById('sort-name');
            nameBtn.innerText = sortDirection === 1 ? "A-Z 🔤" : "Z-A 🔤";
            updateListDisplay();
        }

        function updateListDisplay() {
            const listDiv = document.getElementById("bestand-liste");
            let keys = Object.keys(products);
            
            if (keys.length === 0) {
                listDiv.innerHTML = "Dein Bestand ist leer.";
                let statsBox = document.getElementById("stats-anzeige");
                if (statsBox) {
                    statsBox.innerHTML = `Insgesamt: <b>0</b> verschiedene Artikel | Gesamtstückzahl: <b>0 Stk.</b>
                    <button onclick="clearLocalProductsOnly()" style="background: #d90000; color: white; padding: 10px; font-size: 14px; margin-top: 15px; border-radius: 6px; border: none; font-weight: bold; width: 100%;">⚠️ Lokalen Bestand leeren</button>`;
                }
                return;
            }
            
            // MESSERSCHARF REPARIERT: Vergleicht nameA jetzt korrekt mit nameB (itemB)!
            keys.sort((a, b) => {
                let itemA = products[a];
                let itemB = products[b];
                let nameA = (itemA && itemA.fullName) ? itemA.fullName : "zzz";
                let nameB = (itemB && itemB.fullName) ? itemB.fullName : "zzz";
                return nameA.localeCompare(nameB) * sortDirection;
            });
            
            let html = "";
            let gesamtStueckzahl = 0;
            let verschiedeneArtikel = keys.length;

            for (let i = 0; i < keys.length; i++) {
                let code = keys[i];
                let item = products[code];
                if (item) {
                    gesamtStueckzahl += (item.anzahl || 0);
                    html += `<div class="product-item"><div class="product-header"><span>• <b>${item.fullName || 'Unbekannt'}</b> | Anzahl: <b>${item.anzahl || 0} Stk.</b></span><button class="btn-rename" onclick="renameProduct('${code}')">N 🟪</button></div></div>`;
                }
            }
            
            listDiv.innerHTML = html;
            
            let statsBox = document.getElementById("stats-anzeige");
            if (!statsBox) {
                statsBox = document.createElement("div");
                statsBox.id = "stats-anzeige";
                statsBox.style.cssText = "background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-top: 15px; font-size: 15px; text-align: center; color: #aaa;";
                document.querySelector('.container').appendChild(statsBox);
            }
            statsBox.innerHTML = `Insgesamt: <b>${verschiedeneArtikel}</b> verschiedene Artikel | Gesamtstückzahl: <b>${gesamtStueckzahl} Stk.</b> 
            <br><span style="font-size:11px; color:#00b300;">☁️ Cloud-Synchronisierung aktiv</span>
            <button onclick="clearLocalProductsOnly()" style="background: #d90000; color: white; padding: 10px; font-size: 14px; margin-top: 15px; border-radius: 6px; border: none; font-weight: bold; width: 100%;">⚠️ Lokalen Bestand leeren</button>`;
        }

        // Passwort-Sperre abfragen
        setTimeout(() => {
            if (cloudAuthenticated !== "true") {
                let userPass = prompt("Bitte gib das Bestand-Passwort ein:");
                if (userPass === "bier123") {
                    localStorage.setItem('cloud_auth_ok', "true");
                    cloudAuthenticated = "true";
                    loadFromCloud();
                } else {
