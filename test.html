<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Pro - TESTSEITE</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        input, button, select { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; box-sizing: border-box; font-weight: bold; }
        input, select { background: #222; color: white; text-align: center; }
        button { cursor: pointer; }
        .btn-add { background: #00b300; color: white; }
        .btn-remove { background: #d90000; color: white; }
        
        /* Aufgeteiltes Layout unter der Kamera */
        .cam-game-container { display: flex; gap: 10px; margin-top: 5px; }
        .btn-cam-restart { flex: 1; background: #ff9800; color: white; margin: 0; padding: 12px 5px; }
        .btn-game-mode { flex: 2; background: #555; color: white; margin: 0; padding: 12px 5px; }
        .btn-game-mode.active { background: #007bff; }
        
        /* Suche */
        .search-container { position: relative; margin: 15px 0 5px 0; }
        .search-input { text-align: left; padding-left: 45px; background: #222; color: white; border: 1px solid #444; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 20px; }
        
        /* Sortierung */
        .sort-container { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-sort { flex: 1; padding: 10px 5px; font-size: 13px; background: #333; color: #ccc; margin: 0; }
        .btn-sort.active { background: #8a2be2; color: white; }
        
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; max-height: 350px; overflow-y: auto; font-size: 16px; }
        .product-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .product-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-rename { background: #8a2be2; color: white; width: auto; padding: 5px 12px; margin: 0; font-size: 14px; border-radius: 4px; display: inline-block; }
        video { width: 100%; max-width: 400px; border-radius: 12px; background: #000; margin-top: 10px; }
        .section-title { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; margin-bottom: 5px; font-size: 22px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="app-screen">
            <h3 id="status-label" style="color: #00b300;">TEST-MODUS | Bereit zum Scannen</h3>
            
            <!-- Der originale Kamerasucher aus deinem funktionierenden Index -->
            <video id="webcam" autoplay playsinline></video>
            
            <div class="cam-game-container">
                <button class="btn-cam-restart" onclick="startKamera()">📷</button>
                <button class="btn-game-mode" id="game-mode-btn" onclick="toggleGameMode()">🎮 Game Mode: AUS</button>
            </div>
            
            <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
            <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
            
            <div class="section-title">📦 Bestand</div>
            
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-box" class="search-input" placeholder="Bestand durchsuchen..." oninput="updateListDisplay()">
            </div>
            
            <div class="sort-container">
                <button class="btn-sort active" id="sort-name" onclick="setSort('name')">A-Z 🔤</button>
                <button class="btn-sort" id="sort-date" onclick="setSort('date')">Ablaufdatum ⏱️</button>
                <button class="btn-sort" id="sort-loc" onclick="setSort('location')">Lagerort 📍</button>
            </div>
            
            <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>
        </div>
    </div>

    <script>
        let mode = "add";
        let currentSort = "name"; 
        let sortDirection = 1; 
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;

        let gameModeActive = false;
        let streakCount = 0;
        let lastStreakTime = 0;

        let products = JSON.parse(localStorage.getItem('testProducts')) || {};

        // EXAKT DER INTEGRIERTE KAMERA-START AUS DER INDEX-VERSION
        window.addEventListener('load', () => {
            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
            }
            startKamera();
            updateListDisplay();
        });

        function startKamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                // Bindet die Schleife direkt an den Video-Stream, ohne Umwege!
                video.onplay = () => {
                    scanSchleife(video);
                };
            })
            .catch(err => {
                console.error(err);
                alert("Kamera blockiert.");
            });
        }

        function toggleGameMode() {
            gameModeActive = !gameModeActive;
            const btn = document.getElementById("game-mode-btn");
            if (gameModeActive) {
                btn.innerText = "🎮 Game Mode: AN";
                btn.classList.add("active");
                speakCombatArms("Game Mode Activated");
            } else {
                btn.innerText = "🎮 Game Mode: AUS";
                btn.classList.remove("active");
                streakCount = 0;
            }
        }

        function speakCombatArms(text) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    let utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US'; 
                    utterance.pitch = 0.4;    
                    utterance.rate = 0.85;    
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {
                console.error("Sprachfehler:", e);
            }
        }

        function playScanSound(isRemoval) {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                
                if (isRemoval) {
                    oscillator.frequency.setValueAtTime(450, audioCtx.currentTime); 
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.25);
                } else {
                    oscillator.frequency.setValueAtTime(1150, audioCtx.currentTime); 
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.12);
                }
            } catch (e) {
                console.error("Audio-Fehler:", e);
            }
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes && barcodes.length > 0) {
                        // MIT DER NULL AUS DER FUNKTIONIERENDEN VERSION ABSOLUT GESICHERT!
                        let code = barcodes[0].rawValue; 
                        let now = Date.now();
                        
                        if (code === lastScannedCode && (now - lastScanTime) < 3000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        
                        if (window.navigator.vibrate) window.navigator.vibrate(100);

                        // Combat Arms Streak-Logik
                        if (gameModeActive && mode === "add") {
                            if (now - lastStreakTime < 10000) {
                                streakCount++;
                            } else {
                                streakCount = 1; 
                            }
                            lastStreakTime = now;

                            if (streakCount === 1) {
                                playScanSound(false); 
                            } else if (streakCount === 2) {
                                speakCombatArms("Double Kill");
                            } else if (streakCount === 3) {
                                speakCombatArms("Multi Kill");
                            } else if (streakCount === 4) {
                                speakCombatArms("Ultra Kill");
                            } else if (streakCount === 5) {
