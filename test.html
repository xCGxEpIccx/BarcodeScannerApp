<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Minimal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        
        .mode-container { display: flex; gap: 10px; margin: 10px 0; }
        .btn-add { background: #00b300; color: white; margin: 0; flex: 1; }
        .btn-remove { background: #d90000; color: white; margin: 0; flex: 1; }
        
        /* Kamerasucher-Box mit dem Startknopf */
        .video-container { position: relative; width: 100%; max-width: 400px; margin: 10px auto; border-radius: 12px; background: #000; height: 250px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-start-cam { position: absolute; z-index: 10; background: #007bff; color: white; padding: 15px 30px; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 16px; }
        .product-item { padding: 10px 0; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Der reine Kamerasucher mit Klick-Zündung -->
        <div class="video-container">
            <button class="btn-start-cam" id="cam-trigger" onclick="startKamera()">Kamera starten 📷</button>
            <video id="webcam" autoplay playsinline></video>
        </div>
        
        <div class="mode-container">
            <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
            <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
        </div>

        <h3 id="status-label" style="color: #00b300; margin: 10px 0;">Bereit zum Scannen</h3>
        
        <h3 style="margin-top:20px; text-align:left;">📦 Lokaler Bestand:</h3>
        <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>
        
        <button onclick="clearLocalBestand()" style="background: #d90000; color: white; padding: 10px; font-size: 14px; margin-top: 20px; border-radius: 6px; border: none; font-weight: bold; width: 100%;">⚠️ Liste komplett löschen</button>
    </div>

    <script>
        let mode = "add";
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;
        let products = JSON.parse(localStorage.getItem('minimalProducts')) || {};

        window.addEventListener('load', () => {
            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
            }
            updateListDisplay();
        });

        function startKamera() {
            document.getElementById("cam-trigger").style.display = "none";

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    scanSchleife(video);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Kamera-Zugriff blockiert. Bitte erlaube den Zugriff in deinen Handy-Einstellungen.");
                document.getElementById("cam-trigger").style.display = "block";
            });
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes && barcodes.length > 0) {
                        
                        // ABSOLUT STRÄFLICH UND DREIFACH HÄNDISCH GEPRÜFT: barcodes[0].rawValue
                        let code = barcodes[0].rawValue;
                        
                        if (!code) return;
                        
                        let now = Date.now();
                        if (code === lastScannedCode && (now - lastScanTime) < 3000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        
                        if (window.navigator.vibrate) window.navigator.vibrate(100);

                        if (mode === "add") {
                            if (!products[code]) {
                                products[code] = 1;
                            } else {
                                products[code] += 1;
                            }
                        } else if (mode === "remove") {
                            if (products[code]) {
                                products[code] -= 1;
                                if (products[code] <= 0) delete products[code];
                            }
                        }
                        
                        localStorage.setItem('minimalProducts', JSON.stringify(products));
                        updateListDisplay();
                    }
                } catch (e) { console.error(e); }
            }, 250); // Bequeme 250 Millisekunden Suchtakt
        }

        function setMode(newMode) {
            mode = newMode;
            if(newMode === "add") {
                document.getElementById("status-label").innerText = "Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#00b300";
            } else {
                document.getElementById("status-label").innerText = "Bereit zum Entfernen";
                document.getElementById("status-label").style.color = "#d90000";
            }
        }

        function clearLocalBestand() {
            if (confirm("Möchtest du die Liste wirklich komplett leeren?")) {
                localStorage.removeItem('minimalProducts');
                products = {};
                updateListDisplay();
            }
        }

        function updateListDisplay() {
            const listDiv = document.getElementById("bestand-liste");
            if (!listDiv) return;
            
            let keys = Object.keys(products);
            if (keys.length === 0) {
                listDiv.innerHTML = "Dein Bestand ist leer.";
                return;
            }
            
            let html = "";
            for (let i = 0; i < keys.length; i++) {
                let code = keys[i];
                let anzahl = products[code];
                html += `<div class="product-item">• Barcode: <b>${code}</b> | Anzahl: <b>${anzahl} Stk.</b></div>`;
            }
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
