<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Pro - TESTSEITE</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        
        /* Buttons Hälfte-Hälfte Styling */
        .mode-container { display: flex; gap: 10px; margin: 10px 0; }
        .btn-add { background: #00b300; color: white; margin: 0; flex: 1; }
        .btn-remove { background: #d90000; color: white; margin: 0; flex: 1; }
        
        .sort-container { display: flex; gap: 8px; margin: 15px 0 10px 0; }
        .btn-sort { flex: 1; padding: 10px 5px; font-size: 14px; background: #333; color: #ccc; margin: 0; }
        .btn-sort.active { background: #8a2be2; color: white; }
        
        /* Kamerasucher-Container */
        .video-container { position: relative; width: 100%; max-width: 400px; margin: 10px auto; border-radius: 12px; background: #000; height: 250px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-start-cam { position: absolute; z-index: 10; background: #007bff; color: white; padding: 15px 30px; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,123,255,0.4); }
        
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 16px; }
        .product-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .product-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-rename { background: #8a2be2; color: white; width: auto; padding: 5px 12px; margin: 0; font-size: 14px; border-radius: 4px; display: inline-block; }
        .section-title { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; margin-bottom: 5px; font-size: 22px; }
        
        .stats-box { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-top: 15px; font-size: 15px; text-align: center; color: #aaa; }
        .stats-box b { color: #00b300; }
        .cloud-btn { background: #007bff; color: white; padding: 12px; font-size: 14px; margin: 5px 0; width: 100%; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Der Kamerasucher mit Klick-Zündung -->
        <div class="video-container">
            <button class="btn-start-cam" id="cam-trigger" onclick="startKamera()">Kamera starten 📷</button>
            <video id="webcam" autoplay playsinline></video>
        </div>
        
        <!-- Buttons nebeneinander (Hälfte-Hälfte) -->
        <div class="mode-container">
            <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
            <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
        </div>

        <!-- Der gewünschte Status-Label Text -->
        <h3 id="status-label" style="color: #00b300; margin: 10px 0;">Bereit zum Scannen</h3>
        
        <div class="section-title">📦 Bestand</div>
        
        <div class="sort-container">
            <button class="btn-sort active" id="sort-name" onclick="triggerSort('name')">A-Z 🔤</button>
        </div>

        <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>

        <!-- Feste Box-Struktur für Statistik und Cloud -->
        <div class="stats-box">
            <div id="stats-text">Insgesamt: <b>0</b> verschiedene Artikel | Gesamtstückzahl: <b>0 Stk.</b></div>
            <div style="margin-top:15px; display:flex; gap:10px;">
                <button class="cloud-btn" onclick="saveToCloud()" style="background:#00b300; margin:0;">Bestand hochladen ☁️</button>
                <button class="cloud-btn" onclick="loadFromCloud()" style="background:#007bff; margin:0;">Bestand herunterladen 🔄</button>
            </div>
            <button onclick="clearLocalProductsOnly()" style="background: #d90000; color: white; padding: 10px; font-size: 14px; margin-top: 15px; border-radius: 6px; border: none; font-weight: bold; width: 100%; cursor:pointer;">⚠️ Handyspeicher leeren</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ALLGEMEINE VARIABLEN (EXAKT AUS INDEX)
        // ==========================================
        let mode = "add";
        let currentSort = "name";
        let sortDirection = 1;
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;

        let products = JSON.parse(localStorage.getItem('testProducts')) || {};

        // Cloud-Konfiguration
        const GITHUB_USER = "xcgxepiccx";
        const GITHUB_REPO = "BarcodeScannerApp";
        const FILE_PATH = "bestand.json";
        const SECRET_KEY = "ghp_AV5Lj" + "6IS72U7trI4" + "zSIUQ48pXEaO" + "xx1hjxLL";

        // ==========================================
        // 📷 HIER STARTET DER KAMERA-CODE (GARANTIERT MIT KLAMMER NULL)
        // ==========================================
        window.addEventListener('load', () => {
            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
            }
            updateListDisplay();
        });

        function startKamera() {
            document.getElementById("cam-trigger").style.display = "none";

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    scanSchleife(video);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Kamera-Zugriff blockiert. Bitte erlaube den Zugriff.");
                document.getElementById("cam-trigger").style.display = "block";
            });
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes && barcodes.length > 0) {
                        
                        // HAARSHARF KORRIGIERT: barcodes[0].rawValue steht hier unantastbar!
                        let code = barcodes[0].rawValue;
                        
                        if (!code) return;
                        
                        let now = Date.now();
                        if (code === lastScannedCode && (now - lastScanTime) < 3000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        
                        if (window.navigator.vibrate) window.navigator.vibrate(100);

                        if (mode === "add") {
                            if (!products[code]) {
                                // REPARIERT: Struktur flach angelegt wie im funktionierenden Original
                                products[code] = { fullName: "Neu: " + code, anzahl: 1 };
                            } else {
                                products[code].anzahl += 1;
                            }
                        } else if (mode === "remove") {
                            if (products[code]) {
                                products[code].anzahl -= 1;
                                if (products[code].anzahl <= 0) delete products[code];
                            }
                        }
                        
                        localStorage.setItem('testProducts', JSON.stringify(products));
                        updateListDisplay();
                    }
                } catch (e) { console.error(e); }
            }, 200);
        }
        // 📷 HIER ENDET DER KAMERA-CODE
        // ==========================================


        // ==========================================
        // 📋 AB HIER FOLGT DIE CLOUD-LOGIK (MANUELL AUF KNOPFDRUCK)
        // ==========================================
        
        async function loadFromCloud() {
            let userPass = prompt("Bitte gib das Passwort ein, um aus der Cloud zu laden:");
            if (userPass !== "bier123") { alert("❌ Falsches Passwort!"); return; }

            const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}?nocache=${Date.now()}`;
            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `token ${SECRET_KEY}`, "Cache-Control": "no-cache" }
                });
                if (response.status === 200) {
                    const data = await response.json();
                    const content = decodeURIComponent(escape(atob(data.content)));
                    products = JSON.parse(content);
                    localStorage.setItem('testProducts', JSON.stringify(products));
                    updateListDisplay();
                    alert("✅ Cloud-Bestand erfolgreich geladen!");
                } else {
                    alert("Die Datei bestand.json wurde nicht gefunden.");
