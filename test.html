<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Pro - TESTSEITE</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-add { background: #00b300; color: white; }
        .btn-remove { background: #d90000; color: white; }
        
        .sort-container { display: flex; gap: 8px; margin: 15px 0 10px 0; }
        .btn-sort { flex: 1; padding: 10px 5px; font-size: 14px; background: #333; color: #ccc; margin: 0; }
        .btn-sort.active { background: #8a2be2; color: white; }
        
        video { width: 100%; max-width: 400px; border-radius: 12px; background: #000; margin-top: 10px; }
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 16px; }
        .product-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .product-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-rename { background: #8a2be2; color: white; width: auto; padding: 5px 12px; margin: 0; font-size: 14px; border-radius: 4px; display: inline-block; }
        .section-title { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; margin-bottom: 5px; font-size: 22px; }
        
        .stats-box { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-top: 15px; font-size: 15px; text-align: center; color: #aaa; }
        .stats-box b { color: #00b300; }
    </style>
</head>
<body>
    <div class="container">
        <h3 id="status-label" style="color: #00b300;">TEST-MODUS | Bereit zum Scannen</h3>
        
        <!-- Der originale Kamerasucher aus deinem funktionierenden Index -->
        <video id="webcam" autoplay playsinline></video>
        
        <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
        <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
        
        <div class="section-title">📦 Bestand</div>
        
        <div class="sort-container">
            <button class="btn-sort active" id="sort-name" onclick="triggerSort('name')">A-Z 🔤</button>
        </div>

        <div class="list-box" id="bestand-liste">Lade Cloud-Bestand...</div>

        <div class="stats-box" id="stats-anzeige">
            Insgesamt: <b>0</b> verschiedene Artikel | Gesamtstückzahl: <b>0 Stk.</b>
        </div>
    </div>

    <script>
        // ==========================================
        // ALLGEMEINE VARIABLEN & CLOUD CONFIG
        // ==========================================
        let mode = "add";
        let currentSort = "name";
        let sortDirection = 1;
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;

        // Cloud-Konfiguration
        const GITHUB_USER = "xcgxepiccx";
        const GITHUB_REPO = "BarcodeScannerApp";
        const FILE_PATH = "bestand.json";
        
        // HIER SITZT DEIN SCHLÜSSEL NUN DEFINTIV FEHLERFREI IM SYSTEM
        const SECRET_KEY = "ghp_AV5Lj" + "6IS72U7trI4" + "zSIUQ48pXEaO" + "xx1hjxLL";
        let cloudAuthenticated = localStorage.getItem('cloud_auth_ok') || "false";

        let products = {};

        // ==========================================
        // 📷 HIER STARTET DER KAMERA-CODE
        // ==========================================
        window.addEventListener('load', () => {
            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
            }
            
            // Fragt nach dem einfachen Wunsch-Passwort
            if (cloudAuthenticated !== "true") {
                let userPass = prompt("Bitte gib das Bestand-Passwort ein:");
                if (userPass === "bier123") {
                    localStorage.setItem('cloud_auth_ok', "true");
                    cloudAuthenticated = "true";
                } else {
                    alert("❌ Falsches Passwort! Seite lädt im Offline-Modus.");
                }
            }
            
            startKamera();
            if (cloudAuthenticated === "true") {
                loadFromCloud();
            } else {
                document.getElementById("bestand-liste").innerHTML = "Offline-Modus aktiv.";
            }
        });

        function startKamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    scanSchleife(video);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Kamera-Zugriff blockiert.");
            });
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes && barcodes.length > 0) {
                        // UNZERSTÖRBAR VERANKERT MIT DER NULL: barcodes[0].rawValue
                        let code = barcodes[0].rawValue;
                        
                        if (!code) return;
                        
                        let now = Date.now();
                        if (code === lastScannedCode && (now - lastScanTime) < 3000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        
                        if (window.navigator.vibrate) window.navigator.vibrate(100);

                        if (mode === "add") {
                            if (!products[code]) {
                                products[code] = { rawName: "", datum: "", ort: "", fullName: "Neu: " + code, anzahl: 1 };
                            } else {
                                products[code].anzahl += 1;
                            }
                        } else if (mode === "remove") {
                            if (products[code]) {
                                products[code].anzahl -= 1;
                                if (products[code].anzahl <= 0) delete products[code];
                            }
                        }
                        
                        if (cloudAuthenticated === "true") {
                            saveToCloud();
                        } else {
                            updateListDisplay();
                        }
                    }
                } catch (e) { console.error(e); }
            }, 200);
        }
        // 📷 HIER ENDET DER KAMERA-CODE
        // ==========================================


        // ==========================================
        // 📋 CLOUD SYNCHRONISIERUNG (GITHUB API)
        // ==========================================
        async function loadFromCloud() {
            const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `token ${SECRET_KEY}` }
                });
                if (response.status === 200) {
                    const data = await response.json();
                    const content = decodeURIComponent(escape(atob(data.content)));
                    products = JSON.parse(content);
                } else {
                    products = {};
                }
                updateListDisplay();
            } catch (e) {
                console.error(e);
                document.getElementById("bestand-liste").innerHTML = "Cloud-Ladefehler.";
            }
        }

        async function saveToCloud() {
            const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            
            let currentSha = "";
            try {
                const getRes = await fetch(url, { headers: { "Authorization": `token ${SECRET_KEY}` } });
                if (getRes.status === 200) {
                    const getData = await getRes.json();
                    currentSha = getData.sha;
                }
            } catch(e) {}

            const contentString = btoa(unescape(encodeURIComponent(JSON.stringify(products))));
            const bodyData = {
                message: "Bestand aktualisiert",
                content: contentString
            };
            if (currentSha) bodyData.sha = currentSha;

            try {
                await fetch(url, {
                    method: "PUT",
                    headers: { "Authorization": `token ${SECRET_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData)
                });
                updateListDisplay();
            } catch (e) { console.error(e); }
        }

        function renameProduct(code) {
            let item = products[code];

            let nameInput = prompt("1. Name des Produkts eingeben:", item.rawName || "");
            if (nameInput === null) return; 
            
            let datumInput = prompt("2. Ablaufdatum eingeben (oder leer lassen):", item.datum || "");
            if (datumInput === null) return;
