<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Pro</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; box-sizing: border-box; }
        input { background: #222; color: white; text-align: center; }
        button { font-weight: bold; cursor: pointer; }
        .btn-add { background: #00b300; color: white; }
        .btn-remove { background: #d90000; color: white; }
        .btn-login { background: #007bff; color: white; }
        #interactive.viewport { width: 100%; max-width: 400px; height: 300px; border-radius: 12px; background: #000; margin: 10px auto; overflow: hidden; position: relative; }
        #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
        canvas.drawingBuffer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. LOGIN SCREEN -->
        <div id="login-screen">
            <h2>Bitte Passwort eingeben:</h2>
            <input type="password" id="pw-input" placeholder="Passwort">
            <button class="btn-login" onclick="checkPassword()">Einloggen</button>
            <p id="error-msg" style="color: red;"></p>
        </div>

        <!-- 2. APP SCREEN -->
        <div id="app-screen" style="display: none;">
            <h3 id="status-label" style="color: #00b300;">Modus: Hinzufügen (+) | Bereit zum Scannen</h3>
            
            <div id="interactive" class="viewport"></div>
            
            <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
            <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
            
            <h3>Dein Bestand:</h3>
            <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>
        </div>
    </div>

    <script>
        let mode = "add";
        let products = {};
        let lastScannedCode = "";
        let lastScanTime = 0;

        function checkPassword() {
            const input = document.getElementById("pw-input").value;
            if (input === "1234") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-screen").style.display = "block";
                startBarcodeScanner();
            } else {
                document.getElementById("error-msg").innerText = "Falsches Passwort!";
            }
        }

        function startBarcodeScanner() {
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#interactive'),
                    constraints: {
                        facingMode: "environment",
                        width: { min: 640, ideal: 1280 },
                        height: { min: 480, ideal: 720 },
                        focusMode: "continuous"
                    },
                },
                locator: {
                    halfSample: false,
                    patchSize: "large"
                },
                decoder: {
                    readers: ["ean_reader", "ean_8_reader", "code_128_reader", "code_39_reader"]
                }
            }, function(err) {
                if (err) {
                    console.log(err);
                    alert("Kamera-Fehler.");
                    return;
                }
                Quagga.start();
                
                setTimeout(() => {
                    let track = Quagga.CameraAccess.getActiveTrack();
                    if (track && typeof track.getCapabilities === 'function') {
                        let capabilities = track.getCapabilities();
                        if (capabilities.torch) {
                            track.applyConstraints({ advanced: [{ torch: true }] });
                        }
                    }
                }, 1000);
            });

            Quagga.onProcessed(function(result) {
                let drawingCtx = Quagga.canvas.ctx.overlay,
                    drawingCanvas = Quagga.canvas.dom.overlay;

                if (result) {
                    if (result.boxes) {
                        drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
                        result.boxes.filter(function (box) {
                            return box !== result.box;
                        }).forEach(function (box) {
                            Quagga.actions.drawPath(box, {x: 0, y: 1}, drawingCtx, {color: "green", lineWidth: 2});
                        });
                    }

                    if (result.box) {
                        Quagga.actions.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "blue", lineWidth: 2});
                    }
                }
            });

            Quagga.onDetected(function(data) {
                let code = data.codeResult.code;
                let now = Date.now();
                
                if (code === lastScannedCode && (now - lastScanTime) < 2000) {
                    return;
                }
                
                lastScannedCode = code;
                lastScanTime = now;
                
                if (window.navigator.vibrate) window.navigator.vibrate(100);

                if (mode === "add") {
                    products[code] = (products[code] || 0) + 1;
                } else if (mode === "remove") {
                    if (products[code]) {
                        products[code] -= 1;
                        if (products[code] <= 0) delete products[code];
                    }
                }
                
                updateListDisplay();
            });
        }

        function setMode(newMode) {
            mode = newMode;
            if(mode === "add") {
                document.getElementById("status-label").innerText = "Modus: Hinzufügen (+) | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#00b300";
            } else {
                document.getElementById("status-label").innerText = "Modus: Entfernen (-) | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#d90000";
            }
        }

        function updateListDisplay() {
            const listDiv = document.getElementById("bestand-liste");
            let keys = Object.keys(products);
            
            if (keys.length === 0) {
                listDiv.innerHTML = "Dein Bestand ist leer.";
                return;
            }
            
            let html = "";
            for (let i = 0; i < keys.length; i++) {
                let code = keys[i];
                html += "• <b>" + code + "</b> | Anzahl: " + products[code] + "<br>";
            }
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
