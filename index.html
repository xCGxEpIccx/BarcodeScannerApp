<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        input, button, select { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; box-sizing: border-box; }
        input, select { background: #222; color: white; text-align: center; }
        button { font-weight: bold; cursor: pointer; }
        .btn-add { background: #00b300; color: white; }
        .btn-remove { background: #d90000; color: white; }
        .btn-toggle-date { background: #555; color: white; font-size: 16px; padding: 10px; margin: 5px 0 15px 0; width: 100%; }
        .btn-toggle-date.active { background: #007bff; }
        video { width: 100%; max-width: 400px; border-radius: 12px; background: #000; margin-top: 10px; }
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 350px; overflow-y: auto; font-size: 16px; }
        .product-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; position: relative; }
        .product-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-rename { background: #8a2be2; color: white; width: auto; padding: 5px 12px; margin: 0; font-size: 14px; border-radius: 4px; display: inline-block; }
        .date-item { padding-left: 15px; color: #aaa; font-size: 14px; font-family: monospace; margin-top: 4px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .overlay-content { background: #222; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <div id="app-screen">
            <h3 id="status-label" style="color: #00b300;">Modus: Hinzufügen (+) | Bereit zum Scannen</h3>
            
            <!-- Der originale Kamerasucher, der eben sofort funktioniert hat! -->
            <video id="webcam" autoplay playsinline></video>
            
            <button class="btn-toggle-date active" id="date-toggle-btn" onclick="toggleDateQuery()">Ablaufdatum-Abfrage: AN ⏱️</button>
            
            <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
            <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
            
            <h3>Dein Bestand:</h3>
            <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>
        </div>
    </div>

    <!-- SCHLAUES DROPDOWN-MENÜ -->
    <div id="product-overlay" class="overlay">
        <div class="overlay-content">
            <h3 style="margin-top:0;">Neuer Code erkannt!</h3>
            <p id="manufacturer-info" style="color: #ff9800; font-size: 14px; font-weight: bold;"></p>
            <p>Möchtest du diesen Code einem existierenden Produkt zuweisen?</p>
            
            <select id="product-dropdown" onchange="checkDropdownSelection()">
                <!-- Wird dynamisch befüllt -->
            </select>
            
            <input type="text" id="new-product-name" placeholder="Neuer Produktname (falls nicht in Liste)" style="display:none;">
            
            <button class="btn-add" onclick="saveDropdownSelection()">Bestätigen & Speichern</button>
        </div>
    </div>

    <script>
        let mode = "add";
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;
        let isScanningBlock = false;
        let askForDate = true;
        let currentScannedCode = "";

        // Bereits bekannte Produkt-IDs
        let produktNamen = {
            "milch": "Vollmilch 1L",
            "kakaomilch": "Nöm Kakaomilch 0.5L",
            "goesser": "Gösser Bier"
        };

        // Verknüpft die Nummern mit den IDs
        let barcodeZuProduktId = {
            "9120139158524": "milch",
            "911200596002": "kakaomilch",
            "011200596002": "kakaomilch"
        };

        let bestand = {};

        // Exakt der originale Kamera-Startbefehl von deinem funktionierenden Bild!
        window.addEventListener('load', () => {
            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
                startKamera();
            } else {
                alert("Bitte nutze Google Chrome auf Android.");
            }
        });

        function startKamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    scanSchleife(video);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Kamera blockiert.");
            });
        }

        function erkenneHersteller(code) {
            if (code.startsWith("91") || code.startsWith("90") || code.startsWith("01")) {
                if (code.includes("1200")) return "Österreich 🇦🇹 | NÖM AG (Kakaomilch)";
                if (code.includes("0139")) return "Österreich 🇦🇹 | Vermutlich Penny Eigenmarke";
                if (code.startsWith("9011") || code.startsWith("9006")) return "Österreich 🇦🇹 | Brau Union (Gösser)";
                return "Hersteller aus Österreich 🇦🇹";
            }
            return "Anderer Hersteller / Ausland";
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended || isScanningBlock) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        // DIE REPARIERTE UND DIE GEFIXTE ZEILE: Holt sich das Ergebnis fehlerfrei!
                        let code = barcodes[0].rawValue;
                        let now = Date.now();
                        
                        if (code === lastScannedCode && (now - lastScanTime) < 3000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        isScanningBlock = true;

                        if (window.navigator.vibrate) window.navigator.vibrate(100);
                        currentScannedCode = code;

                        if (barcodeZuProduktId[code]) {
                            let pId = barcodeZuProduktId[code];
                            frageAblaufdatumUndSichere(pId);
                        } else {
                            oeffneProduktDropdown(code);
                        }
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 250);
        }

        function oeffneProduktDropdown(code) {
            const infoText = document.getElementById("manufacturer-info");
            infoText.innerText = "🔍 " + erkenneHersteller(code) + " (Code: " + code + ")";

            const dropdown = document.getElementById("product-dropdown");
            dropdown.innerHTML = "";

            let optSelect = document.createElement("option");
            optSelect.text = "-- Bitte auswählen oder neu anlegen --";
            optSelect.value = "";
            dropdown.add(optSelect);

            let optNew = document.createElement("option");
            optNew.text = "🆕 ALS NEUES PRODUKT ANLEGEN...";
            optNew.value = "NEW";
            dropdown.add(optNew);

            let ids = Object.keys(produktNamen);
            ids.sort((a,b) => produktNamen[a].localeCompare(produktNamen[b]));
            
            for (let i = 0; i < ids.length; i++) {
                let id = ids[i];
                let opt = document.createElement("option");
                opt.value = id;
                opt.text = "Zuweisen zu: " + produktNamen[id];
                
                if (code.includes("1200") && id === "kakaomilch") {
                    opt.text = "⭐ EMPFOHLEN: " + produktNamen[id];
                }
                dropdown.add(opt);
            }

            document.getElementById("new-product-name").style.display = "none";
            document.getElementById("product-overlay").style.display = "flex";
        }

        function checkDropdownSelection() {
            const selectValue = document.getElementById("product-dropdown").value;
            const nameInput = document.getElementById("new-product-name");
            if (selectValue === "NEW") {
                nameInput.style.display = "block";
                nameInput.value = "";
            } else {
                nameInput.style.display = "none";
            }
        }

        function saveDropdownSelection() {
            const dropdown = document.getElementById("product-dropdown");
            let val = dropdown.value;
            let pId = "";

            if (val === "") {
                alert("Bitte wähle eine Option aus!");
                return;
            }

            if (val === "NEW") {
                let neuerName = document.getElementById("new-product-name").value;
                if (!neuerName) neuerName = "Produkt " + currentScannedCode;
                
                pId = "id_" + Date.now();
                produktNamen[pId] = neuerName;
            } else {
                pId = val;
            }
