<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Pro</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; box-sizing: border-box; }
        input { background: #222; color: white; text-align: center; }
        button { font-weight: bold; cursor: pointer; }
        .btn-add { background: #00b300; color: white; }
        .btn-remove { background: #d90000; color: white; }
        .btn-login { background: #007bff; color: white; }
        video { width: 100%; max-width: 400px; border-radius: 12px; background: #000; margin-top: 10px; }
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; font-size: 16px; }
        .product-item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .date-item { padding-left: 15px; color: #aaa; font-size: 14px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. LOGIN SCREEN -->
        <div id="login-screen">
            <h2>Bitte Passwort eingeben:</h2>
            <input type="password" id="pw-input" placeholder="Passwort">
            <button class="btn-login" onclick="checkPassword()">Einloggen</button>
            <p id="error-msg" style="color: red;"></p>
        </div>

        <!-- 2. APP SCREEN -->
        <div id="app-screen" style="display: none;">
            <h3 id="status-label" style="color: #00b300;">Modus: Hinzufügen (+) | Bereit zum Scannen</h3>
            
            <video id="webcam" autoplay playsinline></video>
            
            <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
            <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
            
            <h3>Dein Bestand:</h3>
            <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>
        </div>
    </div>

    <script>
        let mode = "add";
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;
        let isScanningBlock = false;

        // Deine persönliche Produkt-Datenbank (wird per Pop-up erweitert!)
        let produktDatenbank = {
            "9120139158524": "Vollmilch 1L (Penny)",
            "9019100592002": "Ottakringer Bier 0.5L"
        };

        // Das neue Bestands-System mit Datums-Trennung
        let bestand = {};

        function checkPassword() {
            const input = document.getElementById("pw-input").value;
            if (input === "1234") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-screen").style.display = "block";
                
                if ('BarcodeDetector' in window) {
                    barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
                }
                startKamera();
            } else {
                document.getElementById("error-msg").innerText = "Falsches Passwort!";
            }
        }

        function startKamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    scanSchleife(video);
                });
            })
            .catch(err => {
                alert("Kamera-Zugriff blockiert.");
            });
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended || isScanningBlock) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        let code = barcodes[0].rawValue;
                        let now = Date.now();
                        
                        // Knallharte 3-Sekunden-Sperre gegen versehentliche Doppelscans
                        if (code === lastScannedCode && (now - lastScanTime) < 3000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        isScanningBlock = true; // Scanner einfrieren

                        if (window.navigator.vibrate) window.navigator.vibrate(100);

                        // Namen ermitteln oder neu anlegen
                        if (!produktDatenbank[code]) {
                            let neuerName = prompt("Neues Produkt erkannt! Bitte Namen eingeben:", "Produkt " + code);
                            if (neuerName) {
                                produktDatenbank[code] = neuerName;
                            } else {
                                produktDatenbank[code] = code;
                            }
                        }

                        // Ablaufdatum abfragen (nur beim Hinzufügen sinnvoll)
                        let ablaufdatum = "Kein Datum";
                        if (mode === "add") {
                            let datumInput = prompt("Bitte Ablaufdatum eingeben (z.B. DD.MM.YY) oder leer lassen:", "");
                            if (datumInput) ablaufdatum = datumInput;
                        }

                        verarbeiteBestand(code, ablaufdatum);
                        
                        // Scanner nach Pause wieder freischalten
                        setTimeout(() => { isScanningBlock = false; }, 2000);
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 250);
        }

        function verarbeiteBestand(code, datum) {
            if (!bestand[code]) {
                bestand[code] = {};
            }

            if (mode === "add") {
                bestand[code][datum] = (bestand[code][datum] || 0) + 1;
            } else if (mode === "remove") {
                // Beim Entfernen löschen wir das älteste Datum oder fragen, falls es mehrere gibt
                let daten = Object.keys(bestand[code]);
                if (daten.length > 0) {
                    let zielDatum = daten[0]; // Standard: das erste gefundene Datum nehmen
                    if (daten.length > 1) {
                        let auswahl = prompt("Welches Ablaufdatum entfernen? Verfügbar:\n" + daten.join("\n"), daten[0]);
                        if (bestand[code][auswahl]) zielDatum = auswahl;
                    }
                    bestand[code][zielDatum] -= 1;
                    if (bestand[code][zielDatum] <= 0) delete bestand[code][zielDatum];
                }
                if (Object.keys(bestand[code]).length === 0) delete bestand[code];
            }

            updateListDisplay();
        }

        function setMode(newMode) {
            mode = newMode;
            if(mode === "add") {
                document.getElementById("status-label").innerText = "Modus: Hinzufügen (+) | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#00b300";
            } else {
                document.getElementById("status-label").innerText = "Modus: Entfernen (-) | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#d90000";
            }
        }

        function updateListDisplay() {
            const listDiv = document.getElementById("bestand-liste");
            let produktCodes = Object.keys(bestand);
            
            if (produktCodes.length === 0) {
                listDiv.innerHTML = "Dein Bestand ist leer.";
                return;
            }
            
            let html = "";
            for (let i = 0; i < produktCodes.length; i++) {
                let code = produktCodes[i];
                let name = produktDatenbank[code] || code;
                
                // Berechnet die Gesamtstückzahl aller Ablaufdaten für dieses Produkt
                let gesamtAnzahl = 0;
                let datenHtml = "";
                let daten = Object.keys(bestand[code]);
                
                for (let j = 0; j < daten.length; j++) {
                    let d = daten[j];
                    let anz = bestand[code][d];
                    gesamtAnzahl += anz;
                    datenHtml += `<div class="date-item">↳ Ablaufdatum: <b>${d}</b> | Anzahl: ${anz} Stk.</div>`;
                }
                
                html += `<div class="product-item">
                            📦 <b>${name}</b> | Gesamt: <b>${gesamtAnzahl} Stk.</b>
                            ${datenHtml}
                         </div>`;
            }
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
