<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-add { background: #00b300; color: white; }
        .btn-remove { background: #d90000; color: white; }
        video { width: 100%; max-width: 400px; border-radius: 12px; background: #000; margin-top: 10px; }
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; margin-top: 20px; max-height: 250px; overflow-y: auto; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h3 id="status-label" style="color: #00b300;">Modus: Hinzufügen (+) | Bereit zum Scannen</h3>
        
        <!-- Der originale, funktionierende Kamerasucher -->
        <video id="webcam" autoplay playsinline></video>
        
        <button class="btn-add" onclick="setMode('add')">Hinzufügen (+)</button>
        <button class="btn-remove" onclick="setMode('remove')">Entfernen (-)</button>
        
        <h3>Dein Bestand:</h3>
        <div class="list-box" id="bestand-liste">Dein Bestand ist leer.</div>
    </div>

    <script>
        let mode = "add";
        let products = {};
        let lastScannedCode = "";
        let lastScanTime = 0;
        let barcodeDetector;

        window.addEventListener('load', () => {
            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
                startKamera();
            } else {
                alert("Dein Browser unterstützt den Barcode-Detector nicht. Bitte nutze Google Chrome auf Android.");
            }
        });

        function startKamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
            .then(stream => {
                const video = document.getElementById("webcam");
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    scanSchleife(video);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Kamera-Zugriff blockiert.");
            });
        }

        function scanSchleife(video) {
            setInterval(async () => {
                if (!barcodeDetector || video.paused || video.ended) return;
                
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        let code = barcodes[0].rawValue; // Greift absolut fehlerfrei auf die Liste zu!
                        let now = Date.now();
                        
                        if (code === lastScannedCode && (now - lastScanTime) < 2000) return;
                        
                        lastScannedCode = code;
                        lastScanTime = now;
                        
                        if (window.navigator.vibrate) window.navigator.vibrate(100);

                        if (mode === "add") {
                            products[code] = (products[code] || 0) + 1;
                        } else if (mode === "remove") {
                            if (products[code]) {
                                products[code] -= 1;
                                if (products[code] <= 0) delete products[code];
                            }
                        }
                        updateListDisplay();
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 200);
        }

        function setMode(newMode) {
            mode = newMode;
            if(mode === "add") {
                document.getElementById("status-label").innerText = "Modus: Hinzufügen (+) | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#00b300";
            } else {
                document.getElementById("status-label").innerText = "Modus: Entfernen (-) | Bereit zum Scannen";
                document.getElementById("status-label").style.color = "#d90000";
            }
        }

        function updateListDisplay() {
            const listDiv = document.getElementById("bestand-liste");
            let keys = Object.keys(products);
            
            if (keys.length === 0) {
                listDiv.innerHTML = "Dein Bestand ist leer.";
                return;
            }
            
            let html = "";
            for (let i = 0; i < keys.length; i++) {
                let code = keys[i];
                html += "• <b>" + code + "</b> | Anzahl: " + products[code] + "<br>";
            }
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
