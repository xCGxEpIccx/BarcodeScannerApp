name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libncursesw5-dev libsqlite3-dev lld
          pip install cython

      - name: Build Android App with Official Action
        # Diese offizielle Action nutzt eine feste, stabile Umgebung und verhindert den Pip-Fehler!
        uses: ArtemGovorov/buildozer-action@v1
        with:
          buildozer_version: '1.5.0'
          command: 'buildozer -v android debug'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
