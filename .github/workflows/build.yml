name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-v1

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libncursesw5-dev libsqlite3-dev lld
          pip install --upgrade buildozer cython

      - name: Auto-Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create Custom Buildozer Configuration
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = BarcodeScanner
          package.name = barcodescanner
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3, kivy, opencv
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET, CAMERA
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license = True
          android.skip_apk_rescale = True
          
          # Diese 3 wichtigen Zeilen haben dem System gefehlt:
          source.include_patterns = assets/*
          p4a.branch = master
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build with Buildozer
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
